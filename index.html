    <script>
      // Gracefully suppress Vite dev client WebSocket errors per AI Studio environment constraints (HMR: Disabled)
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && (event.reason || event.detail);
            var str = String((reason && (reason.stack || reason.message)) || reason || '');
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
          window.addEventListener('error', function(event) {
            var str = String((event && (event.message || event.filename)) || '') + ' ' + String((event && event.error && event.error.stack) || '');
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
